
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điểm sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="table-container">
        <span class="table-label">BẢNG ĐIỂM</span>

        <h1>Bảng điểm sinh viên</h1>

        <table class="score-table">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã SV</th>
                    <th>Họ và tên</th>
                    <th>Môn học</th>
                    <th>Điểm</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>SV001</td>
                    <td>Nguyễn Văn An</td>
                    <td>HTML & CSS</td>
                    <td>9.0</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>SV002</td>
                    <td>Trần Thị Bình</td>
                    <td>Lập trình C</td>
                    <td>8.5</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>SV003</td>
                    <td>Lê Văn Cường</td>
                    <td>Cơ sở dữ liệu</td>
                    <td>7.5</td>
                </tr>

                <tr>
                    <td>4</td>
                    <td>SV004</td>
                    <td>Phạm Thị Dung</td>
                    <td>Java</td>
                    <td>8.0</td>
                </tr>

                <tr class="average-row">
                    <td colspan="4">Điểm trung bình</td>
                    <td>8.25</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
